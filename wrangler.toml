name = "devai-controller"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "enable_nodejs_http_server_modules", "nodejs_compat_populate_process_env"]

[ai]
binding = "AI"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/v1/*"]

[observability]
enabled = true

[vars]
NODE_ENV = "production"
PRIMARY_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct"


# Cloudflare Email Service is the transactional mail transport.
# app.jelvan.pro must be onboarded as an Email Sending subdomain.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [ "notification@app.jelvan.pro" ]
