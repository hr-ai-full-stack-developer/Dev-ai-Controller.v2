name: Verify and deploy Cloudflare
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: API and provider tests
        run: npm test
      - name: Build web application
        run: npm run build:web
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Keep deploy independent from verify because a GitHub-hosted runner can fail to
    # initialize before any verification step starts. Deployment still performs its
    # own clean install, typecheck, tests, build and Wrangler validation below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: API and provider tests
        run: npm test
      - name: Build web application
        run: npm run build:web
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing repository secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Provision runtime login secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_JWT_KEY: ${{ secrets.ADMIN_JWT_KEY }}
        run: |
          test -n "$ADMIN_EMAIL" || { echo 'Missing repository secret ADMIN_EMAIL'; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo 'Missing repository secret ADMIN_PASSWORD'; exit 1; }
          test -n "$ADMIN_JWT_KEY" || { echo 'Missing repository secret ADMIN_JWT_KEY'; exit 1; }
          printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$ADMIN_JWT_KEY" | npx wrangler secret put ADMIN_JWT_KEY
      - name: Provision optional email routing destination
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_FORWARD_TO: ${{ secrets.EMAIL_FORWARD_TO }}
        run: |
          if [ -n "$EMAIL_FORWARD_TO" ]; then printf '%s' "$EMAIL_FORWARD_TO" | npx wrangler secret put EMAIL_FORWARD_TO; fi
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
