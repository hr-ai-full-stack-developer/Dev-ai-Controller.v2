<!doctype html>
<html class="light antialiased" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2" />
    <title>Dev’ai Controller</title>
    <meta name="description" content="Dev’ai Controller — Cloudflare Workers AI coding agent and operational dashboard monitoring Resend, Supabase, GitHub, Cloudflare, and OpenAI status, deployed applications, chat history, and non-technical knowledge center." />
    <meta property="og:title" content="Dev’ai Controller" />
    <meta property="og:description" content="Dev’ai Controller — Cloudflare Workers AI coding agent and operational dashboard monitoring Resend, Supabase, GitHub, Cloudflare, and OpenAI status, deployed applications, chat history, and non-technical knowledge center." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var d = document.documentElement;
          var s = localStorage.getItem("hub_theme");
          var m = window.matchMedia("(prefers-color-scheme: dark)");
          if (s === "dark" || (!s && m.matches)) {
            d.classList.add("dark");
          } else {
            d.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8f9fa] dark:bg-[#0f1117] text-[#1a1d24] dark:text-[#f0f3f6] antialiased selection:bg-[#9333ea] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
